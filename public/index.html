<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Contatos</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #2c3e50; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95em; }
        input:focus { outline: none; border-color: #3498db; }
        .btn-group { display: flex; gap: 10px; justify-content: flex-end; }
        button { padding: 10px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.95em; }
        .btn-salvar { background-color: #27ae60; color: white; }
        .btn-salvar:hover { background-color: #219150; }
        .btn-cancelar { background-color: #95a5a6; color: white; }
        .btn-cancelar:hover { background-color: #7f8c8d; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; font-size: 0.9em; }
        th { background-color: #2c3e50; color: white; }
        tr:hover { background-color: #f9f9f9; }
        .btn-editar { background-color: #2980b9; color: white; padding: 6px 12px; font-size: 0.85em; margin-right: 5px; }
        .btn-excluir { background-color: #c0392b; color: white; padding: 6px 12px; font-size: 0.85em; }
        .alerta-cep { font-size: 0.8em; color: #e67e22; margin-top: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Agenda de Contatos</h1>

        <form id="formContato">
            <input type="hidden" id="contatoId">

            <div class="form-grid">
                <div class="form-group">
                    <label for="nome">Nome Completo *</label>
                    <input type="text" id="nome" required placeholder="Ex: João Silva">
                </div>

                <div class="form-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" required placeholder="Ex: joao@email.com">
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone *</label>
                    <input type="text" id="telefone" required placeholder="Ex: (11) 98765-4321">
                </div>

                <div class="form-group">
                    <label for="data_nascimento">Data de Nascimento *</label>
                    <input type="date" id="data_nascimento" required>
                </div>

                <div class="form-group">
                    <label for="cep">CEP *</label>
                    <input type="text" id="cep" maxlength="9" required placeholder="Ex: 01001000">
                    <span id="alertaCep" class="alerta-cep"></span>
                </div>

                <div class="form-group">
                    <label for="logradouro">Logradouro (Rua/Av.)</label>
                    <input type="text" id="logradouro" placeholder="Preenchido pelo CEP">
                </div>

                <div class="form-group">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" placeholder="Ex: 123">
                </div>

                <div class="form-group">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" placeholder="Preenchido pelo CEP">
                </div>

                <div class="form-group">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" placeholder="Preenchido pelo CEP">
                </div>

                <div class="form-group">
                    <label for="estado">Estado (UF)</label>
                    <input type="text" id="estado" maxlength="2" placeholder="Ex: SP">
                </div>
            </div>

            <div class="btn-group">
                <button type="button" class="btn-cancelar" id="btnCancelar" onclick="limparFormulario()">Limpar</button>
                <button type="submit" class="btn-salvar" id="btnSalvar">Salvar Contato</button>
            </div>
        </form>

        <h2>Contatos Cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Contato</th>
                    <th>Nascimento</th>
                    <th>Endereço</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaContatos">
                <!-- Linhas inseridas dinamicamente -->
            </tbody>
        </table>
    </div>

    <script>
        const form = document.getElementById('formContato');
        const alertaCep = document.getElementById('alertaCep');

        // Busca automática no ViaCEP
        document.getElementById('cep').addEventListener('blur', function () {
            const cepLimpo = this.value.replace(/\D/g, '');
            alertaCep.textContent = '';

            if (cepLimpo.length === 8) {
                alertaCep.textContent = 'Buscando CEP...';
                fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.erro) {
                            alertaCep.textContent = 'CEP não encontrado.';
                        } else {
                            document.getElementById('logradouro').value = data.logradouro || '';
                            document.getElementById('bairro').value = data.bairro || '';
                            document.getElementById('cidade').value = data.localidade || '';
                            document.getElementById('estado').value = data.uf || '';
                            alertaCep.textContent = '';
                            document.getElementById('numero').focus();
                        }
                    })
                    .catch(() => {
                        alertaCep.textContent = 'Erro ao consultar a API ViaCEP.';
                    });
            } else if (cepLimpo.length > 0) {
                alertaCep.textContent = 'CEP inválido (deve conter 8 dígitos).';
            }
        });

        // Carregar contatos da API
        function carregarContatos() {
            fetch('/api/contatos')
                .then(res => res.json())
                .then(contatos => {
                    const tbody = document.getElementById('tabelaContatos');
                    tbody.innerHTML = '';

                    contatos.forEach(c => {
                        const tr = document.createElement('tr');
                        const dataFormatada = c.data_nascimento ? c.data_nascimento.split('-').reverse().join('/') : '-';
                        const enderecoCompleto = `${c.logradouro || ''}, ${c.numero || 'S/N'} - ${c.bairro || ''}, ${c.cidade || ''}/${c.estado || ''} (CEP: ${c.cep})`;

                        tr.innerHTML = `
                            <td><strong>${c.nome}</strong></td>
                            <td>${c.email}<br><small>${c.telefone}</small></td>
                            <td>${dataFormatada}</td>
                            <td><small>${enderecoCompleto}</small></td>
                            <td>
                                <button class="btn-editar" onclick="editarContato(${c.id})">Editar</button>
                                <button class="btn-excluir" onclick="excluirContato(${c.id})">Excluir</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                });
        }

        // Salvar ou atualizar contato
        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const id = document.getElementById('contatoId').value;
            const payload = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
                data_nascimento: document.getElementById('data_nascimento').value,
                cep: document.getElementById('cep').value.replace(/\D/g, ''),
                logradouro: document.getElementById('logradouro').value,
                numero: document.getElementById('numero').value,
                bairro: document.getElementById('bairro').value,
                cidade: document.getElementById('cidade').value,
                estado: document.getElementById('estado').value
            };

            const url = id ? `/api/contatos/${id}` : '/api/contatos';
            const method = id ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(() => {
                limparFormulario();
                carregarContatos();
            })
            .catch(err => console.error('Erro ao salvar:', err));
        });

        // Carregar dados no formulário para edição
        function editarContato(id) {
            fetch(`/api/contatos/${id}`)
                .then(res => res.json())
                .then(c => {
                    document.getElementById('contatoId').value = c.id;
                    document.getElementById('nome').value = c.nome;
                    document.getElementById('email').value = c.email;
                    document.getElementById('telefone').value = c.telefone;
                    document.getElementById('data_nascimento').value = c.data_nascimento;
                    document.getElementById('cep').value = c.cep;
                    document.getElementById('logradouro').value = c.logradouro;
                    document.getElementById('numero').value = c.numero;
                    document.getElementById('bairro').value = c.bairro;
                    document.getElementById('cidade').value = c.cidade;
                    document.getElementById('estado').value = c.estado;

                    document.getElementById('btnSalvar').textContent = 'Atualizar Contato';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
        }

        // Excluir contato
        function excluirContato(id) {
            if (confirm('Deseja realmente remover este contato?')) {
                fetch(`/api/contatos/${id}`, { method: 'DELETE' })
                    .then(() => carregarContatos())
                    .catch(err => console.error('Erro ao excluir:', err));
            }
        }

        function limparFormulario() {
            form.reset();
            document.getElementById('contatoId').value = '';
            document.getElementById('btnSalvar').textContent = 'Salvar Contato';
            alertaCep.textContent = '';
        }

        // Inicialização
        carregarContatos();
    </script>
</body>
</html>
